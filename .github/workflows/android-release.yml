name: Android release

# A tag like v1.2.1-android publishes only the Android/Android TV APK. The desktop release script
# keeps its own v1.2.1 tags, so these releases don't collide with it.

on:
  push:
    tags:
      - 'v*-android'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Android APK
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Pick version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          version="${version%-android}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $tag doesn't contain a version like v1.2.1-android"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          # Each release's version code is higher than the last one's, so Android installs it as an update.
          code=$((major * 10000 + minor * 100 + patch))
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing Android $version (version code $code)"

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::HS_KEYSTORE_BASE64 is not set; refusing to publish an APK that can't update existing installs."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperstream.jks"
          echo "HS_KEYSTORE=$RUNNER_TEMP/hyperstream.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          HS_KEYSTORE_PASSWORD: ${{ secrets.HS_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease \
            -PappVersion=${{ steps.version.outputs.value }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Check the APK's signature
        env:
          EXPECTED_SHA256: 9bce46dbbffe5c62cc818473c28a6025c353a47847ea3a195d75394e943a36dd
        run: |
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          if [ "$cert" != "$EXPECTED_SHA256" ]; then
            echo "::error::The APK is signed with another key ($cert); it wouldn't update existing installs."
            exit 1
          fi

      - name: Collect files
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk \
            "dist/HyperStream-${{ steps.version.outputs.value }}-android-and-tv.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -vx "$GITHUB_REF_NAME" \
            | head -1 || true)
          notes=$(mktemp)
          {
            echo "## Android only"
            echo
            echo "**Android phones, tablets and TV:** \`HyperStream-${{ steps.version.outputs.value }}-android-and-tv.apk\` (allow installs from unknown sources)."
            echo
            echo "This release contains only the Android app; there are no desktop builds for this version."
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "${previous:+$previous..}HEAD" | grep -v '\[skip ci\]' || true
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" dist/* \
            -R "$GITHUB_REPOSITORY" \
            --title "Hyper Stream ${{ steps.version.outputs.value }} (Android)" \
            --notes-file "$notes"
          rm -f "$notes"
