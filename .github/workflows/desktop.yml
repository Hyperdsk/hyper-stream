name: Desktop and Android builds

# Builds the desktop app for macOS (Apple silicon and Intel), Linux and Windows, plus the Android
# app, which also runs on Android TV, and uploads them as artifacts. Releases are made by
# scripts/release.sh and release-all.yml instead.
#
# Run by hand with a release tag (scripts/release.sh --add-platforms does this), it builds that
# release's missing desktop apps and adds them to it, never replacing files already there.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Add Windows, Linux and Intel Mac builds to this release (e.g. v1.2.0)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Desktop tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Test
        run: ./gradlew :appCore:jvmTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-reports
          path: appCore/build/reports/tests/

  database:
    name: Sync database tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Test schema.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: backend/supabase/tests/run.sh

  desktop:
    name: Desktop (${{ matrix.name }})
    # Adding to a release: only once the tests pass
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            os: blacksmith-6vcpu-macos-15
            java-arch: aarch64
            package: packageDmg
            output: dmg
          - name: macos-intel
            os: blacksmith-6vcpu-macos-15
            java-arch: x64
            package: packageDmg
            output: dmg
          - name: linux-x64
            os: blacksmith-4vcpu-ubuntu-2404
            java-arch: x64
            package: packageDeb
            output: deb
          - name: windows-x64
            os: blacksmith-4vcpu-windows-2025
            java-arch: x64
            package: packageMsi
            output: msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      # Blacksmith's Macs are Apple silicon only: the Intel app is made by an Intel JDK under
      # Rosetta, as scripts/release.sh does on a Mac (jpackage builds for the JDK it runs on)
      - name: Install Rosetta
        if: runner.os == 'macOS' && matrix.java-arch == 'x64'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          architecture: ${{ matrix.java-arch }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Pick version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # For a release: a platform it already has (such as the Mac that made it) isn't built again
      - name: Check the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          name="HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}.${{ matrix.output }}"
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$name"; then
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Build installer and portable app
        if: env.SKIP != 'true'
        run: ./gradlew :desktopApp:${{ matrix.package }} :desktopApp:createDistributable -PappVersion=${{ steps.version.outputs.value }}

      - name: Check the Intel build is for Intel
        if: matrix.name == 'macos-intel' && env.SKIP != 'true'
        run: file desktopApp/build/compose/binaries/main/app/HyperStream.app/Contents/MacOS/HyperStream | grep -q x86_64

      - name: Collect files
        if: env.SKIP != 'true'
        run: |
          mkdir -p dist
          out=desktopApp/build/compose/binaries/main
          for f in "$out/${{ matrix.output }}"/*; do
            cp "$f" "dist/HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}.${f##*.}"
          done
          # A portable copy that needs no installer
          case "${{ matrix.name }}" in
            windows-*) (cd "$out/app" && if command -v 7z >/dev/null; then 7z a -tzip "$GITHUB_WORKSPACE/dist/HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}-portable.zip" HyperStream >/dev/null; else powershell -NoProfile -Command "Compress-Archive -Path HyperStream -DestinationPath '$GITHUB_WORKSPACE/dist/HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}-portable.zip'"; fi) ;;
            linux-*) tar -czf "dist/HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}.tar.gz" -C "$out/app" HyperStream ;;
            macos-*) ditto -c -k --keepParent "$out/app/HyperStream.app" "dist/HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}.zip" ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.SKIP != 'true'
        with:
          name: HyperStream-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Sign for the in-app updater
        if: inputs.release_tag != '' && env.SKIP != 'true'
        env:
          HS_UPDATE_SIGNING_KEY: ${{ secrets.HS_UPDATE_SIGNING_KEY }}
        run: scripts/sign-desktop.sh dist/*

      - name: Add to the release
        if: inputs.release_tag != '' && env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/upload-missing.sh "$RELEASE_TAG" dist/*

  android:
    name: Android and Android TV
    # A release's APK comes from the Mac that made it, signed and numbered for updates
    if: inputs.release_tag == ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Pick version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Every build is signed with the same key (the HS_KEYSTORE_* secrets), so each one installs
      # over the last. Without the secrets (pull requests from forks) it uses a throwaway debug key
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperstream.jks"
            echo "HS_KEYSTORE=$RUNNER_TEMP/hyperstream.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No HS_KEYSTORE_BASE64 secret: this APK won't install over other builds"
          fi

      # The same Compose app as the desktop builds, for phones, tablets and Android TV
      - name: Build APK
        env:
          HS_KEYSTORE_PASSWORD: ${{ secrets.HS_KEYSTORE_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -PappVersion=${{ steps.version.outputs.value }} -PappVersionCode=${{ github.run_number }}

      - name: Collect files
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*.apk dist/HyperStream-${{ steps.version.outputs.value }}-android-and-tv.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HyperStream-android
          path: dist/*
          if-no-files-found: error
