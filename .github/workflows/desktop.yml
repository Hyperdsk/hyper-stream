name: Desktop and Android builds

# Builds the desktop app for macOS (Apple silicon and Intel), Linux and Windows, plus the Android
# app, which also runs on Android TV, and uploads them as artifacts. Releases are built and
# published from a Mac with scripts/release.sh instead, which skips this workflow.
#
# Run by hand with a release tag (scripts/release.sh --all-platforms does this), it builds that
# release's Windows, Linux and Intel Mac apps, which a Mac can't make, and adds them to it.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Add Windows, Linux and Intel Mac builds to this release (e.g. v1.2.0)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Desktop tests
    # A release was tested when it was made
    if: inputs.release_tag == ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: ./gradlew :appCore:jvmTest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: appCore/build/reports/tests/

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            os: blacksmith-6vcpu-macos-15
            package: packageDmg
            output: dmg
          - name: macos-intel
            os: macos-15-intel
            package: packageDmg
            output: dmg
          - name: linux-x64
            os: blacksmith-4vcpu-ubuntu-2404
            package: packageDeb
            output: deb
          - name: windows-x64
            os: blacksmith-4vcpu-windows-2025
            package: packageMsi
            output: msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # For a release, the Apple silicon app is already there from the Mac that made it
      SKIP: ${{ inputs.release_tag != '' && matrix.name == 'macos-apple-silicon' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Pick version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer and portable app
        if: env.SKIP != 'true'
        run: ./gradlew :desktopApp:${{ matrix.package }} :desktopApp:createDistributable -PappVersion=${{ steps.version.outputs.value }}

      - name: Collect files
        if: env.SKIP != 'true'
        run: |
          mkdir -p dist
          out=desktopApp/build/compose/binaries/main
          for f in "$out/${{ matrix.output }}"/*; do
            cp "$f" "dist/HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}.${f##*.}"
          done
          # A portable copy that needs no installer
          case "${{ matrix.name }}" in
            windows-*) (cd "$out/app" && 7z a -tzip "$GITHUB_WORKSPACE/dist/HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}-portable.zip" HyperStream >/dev/null) ;;
            linux-*) tar -czf "dist/HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}.tar.gz" -C "$out/app" HyperStream ;;
            macos-*) ditto -c -k --keepParent "$out/app/HyperStream.app" "dist/HyperStream-${{ steps.version.outputs.value }}-${{ matrix.name }}.zip" ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        if: env.SKIP != 'true'
        with:
          name: HyperStream-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Add to the release
        if: inputs.release_tag != '' && env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"

  android:
    name: Android and Android TV
    # A release's APK comes from the Mac that made it, signed and numbered for updates
    if: inputs.release_tag == ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Pick version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Every build is signed with the same key (the HS_KEYSTORE_* secrets), so each one installs
      # over the last. Without the secrets (pull requests from forks) it uses a throwaway debug key
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperstream.jks"
            echo "HS_KEYSTORE=$RUNNER_TEMP/hyperstream.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No HS_KEYSTORE_BASE64 secret: this APK won't install over other builds"
          fi

      # The same Compose app as the desktop builds, for phones, tablets and Android TV
      - name: Build APK
        env:
          HS_KEYSTORE_PASSWORD: ${{ secrets.HS_KEYSTORE_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -PappVersion=${{ steps.version.outputs.value }} -PappVersionCode=${{ github.run_number }}

      - name: Collect files
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*.apk dist/HyperStream-${{ steps.version.outputs.value }}-android-and-tv.apk

      - uses: actions/upload-artifact@v7
        with:
          name: HyperStream-android
          path: dist/*
          if-no-files-found: error
