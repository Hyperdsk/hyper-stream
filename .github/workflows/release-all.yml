name: Release all platforms

# A full version tag such as v1.2.3 builds the Android/Android TV APK and the macOS, Linux and
# Windows apps, then publishes them together, after the tests pass.
#
# scripts/release.sh pushes its tag with a "Built locally:" line listing the files it uploads
# itself. Then this workflow waits for those, builds only the platforms that are missing, adds
# them, and leaves the release as the script made it (a draft stays a draft). Files already in a
# release are never replaced.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      skip: ${{ steps.pick.outputs.skip }}
      local: ${{ steps.pick.outputs.local }}
      version: ${{ steps.pick.outputs.version }}
      code: ${{ steps.pick.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Pick version and create the draft release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::notice::$tag is not a full release tag; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version="$major.$minor.$patch"
          # Must match scripts/release.sh (and stay above every earlier release's code)
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

          # Made by scripts/release.sh: wait until the files it uploads itself are all there
          git fetch -q --force origin "refs/tags/$tag:refs/tags/$tag"
          local_files=$(git for-each-ref "refs/tags/$tag" --format='%(contents)' | sed -n 's/^Built locally: //p' | tr ',' ' ')
          if [ -n "$local_files" ]; then
            echo "local=true" >> "$GITHUB_OUTPUT"
            for attempt in $(seq 1 80); do
              have=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)
              missing=""
              for f in $local_files; do grep -qxF "$f" <<<"$have" || missing="$missing $f"; done
              [ -z "$missing" ] && break
              sleep 30
            done
            if [ -n "$missing" ]; then
              echo "::error::release.sh's files never all reached the release:$missing"
              exit 1
            fi
          fi

          # Every platform already there: nothing to do
          if gh release view "$tag" >/dev/null 2>&1; then
            count=$(gh release view "$tag" --json assets --jq '[.assets[] | select((.name | startswith("HyperStream-")) and (.name | endswith(".sig") | not))] | length')
            if [ "$count" -ge 9 ]; then
              echo "::notice::$tag already has all platform builds; leaving it alone."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # The script wrote the release and its notes itself
          [ -n "$local_files" ] && exit 0

          previous=$(gh release list --limit 50 --json tagName --jq '.[].tagName' | grep -vx "$tag" | head -1 || true)
          notes=$(mktemp)
          {
            echo "## Download"
            echo
            echo "- **macOS:** \`-macos-apple-silicon.dmg\` for M-series Macs and \`-macos-intel.dmg\` for Intel Macs. Needs [VLC](https://www.videolan.org/vlc/). The app isn't notarized: the first time, right-click it and choose Open. The \`.zip\` is the same app without an installer."
            echo "- **Android phones, tablets and TV:** \`-android-and-tv.apk\` (allow installs from unknown sources). It installs over earlier releases."
            echo "- **Windows:** the \`.msi\` installer, or the portable \`.zip\`. **Linux:** the \`.deb\` package, or the portable \`.tar.gz\`. Both need VLC."
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "${previous:+$previous..}HEAD" | grep -v '\[skip ci\]' || true
          } > "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Hyper Stream $version" --notes-file "$notes"
          else
            gh release create "$tag" --draft --title "Hyper Stream $version" --notes-file "$notes"
          fi
          rm -f "$notes"

  test:
    name: Tests
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Desktop tests
        run: ./gradlew :appCore:jvmTest

      - name: Sync database tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: backend/supabase/tests/run.sh

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [prepare, test]
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            os: blacksmith-6vcpu-macos-15
            java-arch: aarch64
            package: packageDmg
            output: dmg
          - name: macos-intel
            os: blacksmith-6vcpu-macos-15
            java-arch: x64
            package: packageDmg
            output: dmg
          - name: linux-x64
            os: blacksmith-4vcpu-ubuntu-2404
            java-arch: x64
            package: packageDeb
            output: deb
          - name: windows-x64
            os: blacksmith-4vcpu-windows-2025
            java-arch: x64
            package: packageMsi
            output: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Blacksmith's Macs are Apple silicon only: the Intel app is made by an Intel JDK under
      # Rosetta, as scripts/release.sh does on a Mac (jpackage builds for the JDK it runs on)
      - name: Install Rosetta
        if: runner.os == 'macOS' && matrix.java-arch == 'x64'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          architecture: ${{ matrix.java-arch }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      # Already uploaded (by release.sh from its Mac, or an earlier run): not built again
      - name: Check the release
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="HyperStream-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.${{ matrix.output }}"
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$name"; then
            echo "::notice::$name is already in the release; skipping this platform."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer and portable app
        if: steps.have.outputs.skip != 'true'
        run: ./gradlew :desktopApp:${{ matrix.package }} :desktopApp:createDistributable -PappVersion=${{ needs.prepare.outputs.version }}

      - name: Check the Intel build is for Intel
        if: matrix.name == 'macos-intel' && steps.have.outputs.skip != 'true'
        run: file desktopApp/build/compose/binaries/main/app/HyperStream.app/Contents/MacOS/HyperStream | grep -q x86_64

      - name: Collect files
        if: steps.have.outputs.skip != 'true'
        run: |
          mkdir -p dist
          out=desktopApp/build/compose/binaries/main
          for f in "$out/${{ matrix.output }}"/*; do
            cp "$f" "dist/HyperStream-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.${f##*.}"
          done
          case "${{ matrix.name }}" in
            windows-*) (cd "$out/app" && if command -v 7z >/dev/null; then 7z a -tzip "$GITHUB_WORKSPACE/dist/HyperStream-${{ needs.prepare.outputs.version }}-${{ matrix.name }}-portable.zip" HyperStream >/dev/null; else powershell -NoProfile -Command "Compress-Archive -Path HyperStream -DestinationPath '$GITHUB_WORKSPACE/dist/HyperStream-${{ needs.prepare.outputs.version }}-${{ matrix.name }}-portable.zip'"; fi) ;;
            linux-*) tar -czf "dist/HyperStream-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.tar.gz" -C "$out/app" HyperStream ;;
            macos-*) ditto -c -k --keepParent "$out/app/HyperStream.app" "dist/HyperStream-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.zip" ;;
          esac
          ls -lh dist

      - name: Sign for the in-app updater
        if: steps.have.outputs.skip != 'true'
        env:
          HS_UPDATE_SIGNING_KEY: ${{ secrets.HS_UPDATE_SIGNING_KEY }}
        run: scripts/sign-desktop.sh dist/*

      - name: Add to the release
        if: steps.have.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/upload-missing.sh "$GITHUB_REF_NAME" dist/*

  android:
    name: Android and Android TV
    needs: [prepare, test]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Check the release
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="HyperStream-${{ needs.prepare.outputs.version }}-android-and-tv.apk"
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$name"; then
            echo "::notice::$name is already in the release; skipping Android."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up signing key
        if: steps.have.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.HS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::HS_KEYSTORE_BASE64 is not set; refusing to publish an APK that can't update existing installs."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperstream.jks"
          echo "HS_KEYSTORE=$RUNNER_TEMP/hyperstream.jks" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.have.outputs.skip != 'true'
        env:
          HS_KEYSTORE_PASSWORD: ${{ secrets.HS_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease \
            -PappVersion=${{ needs.prepare.outputs.version }} \
            -PappVersionCode=${{ needs.prepare.outputs.code }}

      - name: Check the APK's signature
        if: steps.have.outputs.skip != 'true'
        env:
          EXPECTED_SHA256: 9bce46dbbffe5c62cc818473c28a6025c353a47847ea3a195d75394e943a36dd
        run: |
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          if [ "$cert" != "$EXPECTED_SHA256" ]; then
            echo "::error::The APK is signed with another key ($cert); it wouldn't update existing installs."
            exit 1
          fi

      - name: Collect files
        if: steps.have.outputs.skip != 'true'
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk \
            "dist/HyperStream-${{ needs.prepare.outputs.version }}-android-and-tv.apk"
          ls -lh dist

      - name: Add to the release
        if: steps.have.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/upload-missing.sh "$GITHUB_REF_NAME" dist/*

  publish:
    name: Publish release
    needs: [prepare, test, desktop, android]
    # A release from release.sh is published (or kept as a draft) by the script, not here
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.local != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json url --jq .url
